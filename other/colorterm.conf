# Advertise 24-bit color support to programs started by the systemd user
# session (desktop launchers, autostart, .desktop files).
#
# Why this exists: Emacs decides a tty frame's color depth from COLORTERM in
# its *own process* environment, at the moment the frame is created -- not from
# the environment emacsclient forwards. A GUI `emacs` launched from the desktop
# inherits no COLORTERM, so every `emacsclient -t` frame it serves falls back to
# 256 colors and themes render with a quantized palette (catppuccin mocha's
# #1e1e2e background degrades to #111122). Setting it here fixes it at the
# source. Note that Emacs's own `setenv` does NOT work as a substitute: it only
# touches `process-environment`, not the real environ that terminal setup reads.
#
# Symlinked to ~/.config/environment.d/90-colorterm.conf -- see `make install-environment`.
COLORTERM=truecolor
